version: 2
updates:
  # Site dependencies (pnpm). Minor and patch bumps land in a single weekly PR;
  # majors get their own PR so breaking changes can be reviewed one by one.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]

  # Base image in the Dockerfile (node:XX-alpine)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
